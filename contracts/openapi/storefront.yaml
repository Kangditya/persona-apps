openapi: 3.1.0
info:
  title: Qurban Storefront API
  version: 1.0.0-draft
  description: |
    Phase 1 public contract. Event and Offering discovery routes are
    implemented; common-purchase routes remain contract-only until their
    owning vertical slice is implemented.
servers:
  - url: https://api.example.invalid
    description: Deployment-specific base URL
security: []
tags:
  - name: Events
    description: Public active-event availability.
  - name: Offerings
    description: Public published offering catalogue.
  - name: Purchases
    description: Guest common-purchase tracking and commands.
paths:
  /api/public/v1/events/active:
    get:
      tags: [Events]
      operationId: getActiveEvent
      summary: Get the active event
      description: |
        Event discovery is independent of whether its registration window is
        currently open. The returned window instants let the UI communicate
        that state. Availability is a snapshot; checkout remains authoritative
        for quota.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: The active event, or no active event.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/PublicEvent"
                      - type: "null"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/public/v1/events/{event_id}/offerings:
    get:
      tags: [Offerings]
      operationId: listActiveEventOfferings
      summary: List published offerings for an active event
      description: |
        Returns only published Offerings for an active Event, ordered by code
        ascending and then ID ascending. Availability is advisory. The opaque
        cursor has no total count; registration-window state does not hide
        catalogue discovery.
      parameters:
        - $ref: "#/components/parameters/EventID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200": { $ref: "#/components/responses/PublicOfferingList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/public/v1/offerings/{offering_id}:
    get:
      tags: [Offerings]
      operationId: getOffering
      summary: Get a published offering
      parameters:
        - $ref: "#/components/parameters/OfferingID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: A published offering.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PublicOffering"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/public/v1/purchases:
    post:
      tags: [Purchases]
      operationId: createCommonPurchase
      summary: Create one common purchase for one offering
      description: |
        Creates a pending common Purchase and reserves participant quota. The
        same Idempotency-Key and canonical request replay the committed status
        and body; a changed request returns idempotency_conflict. The one-time
        Purchase access token is returned only in this checkout result and is
        never available through a read endpoint. Party references are opaque,
        request-local labels: reuse occurs only when a role explicitly names a
        label declared by purchaser or payer in this same request.
      x-idempotency:
        namespace: storefront.purchase.create.guest
        replay: exact request hash returns the original successful response
        mismatch: idempotency_conflict
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: One JSON object, limited to 64 KiB. Participant count must fit the selected Offering's captured capacity.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseRequest"
            examples:
              shared_purchaser_payer:
                summary: Purchaser pays and is one intended participant.
                value:
                  offering_id: "11111111-1111-1111-1111-111111111111"
                  purchaser:
                    party_ref: purchaser
                    display_name: Siti Aminah
                    email: siti@example.test
                  payer: { party_ref: purchaser }
                  participants:
                    - { party_ref: purchaser }
                    - { display_name: Ahmad }
              distinct_purchaser_and_payer:
                summary: A distinct payer and an unresolved intended participant.
                value:
                  offering_id: "11111111-1111-1111-1111-111111111111"
                  purchaser:
                    party_ref: purchaser
                    display_name: Siti Aminah
                  payer:
                    party_ref: payer
                    display_name: Budi Santoso
                    phone: "+628100000000"
                  participants:
                    - { party_ref: payer }
                    - { display_name: Ahmad }
      responses:
        "201":
          description: The pending purchase and its opaque access token.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePurchaseResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedJSONMediaType" }
        "409": { $ref: "#/components/responses/CheckoutConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/public/v1/purchases/{purchase_id}:
    get:
      tags: [Purchases]
      operationId: getPurchase
      summary: Get a purchase using its scoped bearer token
      security:
        - PurchaseBearer: []
      parameters:
        - $ref: "#/components/parameters/PurchaseID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Public fields for the identified purchase.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PublicPurchase"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/public/v1/purchases/{purchase_id}/cancel:
    post:
      tags: [Purchases]
      operationId: cancelPurchase
      summary: Cancel a pending purchase
      description: A cancellation releases an active quota reservation when the lifecycle permits it.
      security:
        - PurchaseBearer: []
      x-idempotency:
        namespace: storefront.purchase.cancel
        replay: exact request hash returns the original successful response
        mismatch: idempotency_conflict
      parameters:
        - $ref: "#/components/parameters/PurchaseID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelPurchaseRequest"
      responses:
        "200":
          description: The cancelled purchase.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PublicPurchase"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CommandConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/public/v1/purchases/{purchase_id}/payment-evidence:
    post:
      tags: [Purchases]
      operationId: submitPaymentEvidence
      summary: Submit payment evidence for a purchase
      description: |
        The declared amount and currency must equal the outstanding amount. The
        file is private evidence; API responses never disclose its storage reference.
      security:
        - PurchaseBearer: []
      x-idempotency:
        namespace: storefront.purchase.payment-evidence.submit
        scope: identified Purchase UUID after Purchase Bearer authentication
        replay: exact semantic request hash returns the original successful response durably
        mismatch: idempotency_conflict
      parameters:
        - $ref: "#/components/parameters/PurchaseID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PaymentEvidenceRequest"
            encoding:
              evidence_file:
                contentType: image/jpeg, image/png, application/pdf
      responses:
        "201":
          description: Submitted payment evidence awaiting Operations review.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PublicPayment"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CommandConflict" }
        "413": { $ref: "#/components/responses/EvidenceTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    PurchaseBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque purchase token
      description: A Purchase-scoped opaque credential, never an Operations session or payment credential.
  headers:
    RequestID:
      description: Accepted X-Request-ID or a generated opaque request correlation identifier.
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    RetryAfter:
      description: Bounded delay in seconds before retrying a rate-limited request.
      required: true
      schema: { type: integer, minimum: 1, maximum: 60 }
    NoStoreCacheControl:
      description: Week 2 catalogue responses must not be stored because status and advisory quota can change.
      required: true
      schema: { type: string, const: no-store }
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional bounded request correlation identifier. Invalid values are rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque key reused only to retry one command intent.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,254}$"
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor for the documented offering order.
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    EventID:
      name: event_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OfferingID:
      name: offering_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PurchaseID:
      name: purchase_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    InvalidRequest:
      description: Malformed request or correlation header.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    Unauthenticated:
      description: Missing, malformed, expired, revoked, or unmatched Purchase bearer token.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    Forbidden:
      description: The Purchase bearer token is valid but not scoped to the requested Purchase.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    NotFound:
      description: The requested public resource does not exist or is not publicly available.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    CheckoutConflict:
      description: Checkout state or quota is unavailable, or the idempotency key was reused with a different payload.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    CommandConflict:
      description: The command violates the current lifecycle or idempotency replay contract.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    EvidenceTooLarge:
      description: The evidence file exceeds 10 MiB.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    UnsupportedMediaType:
      description: Evidence must be a JPEG, PNG, or PDF.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    RequestTooLarge:
      description: The JSON command body exceeds the documented 64 KiB limit.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    UnsupportedJSONMediaType:
      description: The command requires Content-Type application/json.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    ValidationFailed:
      description: The request is syntactically valid but violates field or business validation.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    RateLimited:
      description: Request rate is temporarily limited.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    InternalError:
      description: An unexpected error occurred. Error details never contain internals or credentials.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    ServiceUnavailable:
      description: A required dependency is temporarily unavailable.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    MethodNotAllowed:
      description: The resource exists but does not support the requested method.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    PublicOfferingList:
      description: Bounded page of published public Offerings.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStoreCacheControl" }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, page]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/PublicOffering" }
              page: { $ref: "#/components/schemas/PublicOfferingPage" }
  schemas:
    PublicEvent:
      type: object
      additionalProperties: false
      required: [id, event_year, name, status]
      properties:
        id: { type: string, format: uuid }
        event_year: { type: integer, minimum: 1900, maximum: 9999 }
        name: { type: string, minLength: 1, maxLength: 255 }
        status: { type: string, const: ACTIVE }
        registration_opens_at: { type: string, format: date-time }
        registration_closes_at: { type: string, format: date-time }
    PublicOffering:
      type: object
      additionalProperties: false
      required:
        [
          id,
          event_id,
          code,
          name,
          offering_kind,
          price_minor,
          currency_code,
          participant_capacity,
          available_participant_units,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 255 }
        offering_kind: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, maxLength: 10000 }
        price_minor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        currency_code: { type: string, pattern: "^[A-Z]{3}$" }
        participant_capacity: { type: integer, minimum: 1, maximum: 2147483647 }
        available_participant_units:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
          description: Advisory availability snapshot. Null means no finite Event or Offering quota applies.
        status: { type: string, const: PUBLISHED }
    PublicOfferingPage:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        next_cursor: { type: string, minLength: 1, maxLength: 512 }
    CreatePurchaseRequest:
      type: object
      additionalProperties: false
      required: [offering_id, purchaser, payer, participants]
      properties:
        offering_id: { type: string, format: uuid }
        purchaser: { $ref: "#/components/schemas/PartyDeclaration" }
        payer:
          oneOf:
            - $ref: "#/components/schemas/PartyDeclaration"
            - $ref: "#/components/schemas/PartyReference"
        participants:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: "#/components/schemas/PartyReference"
              - $ref: "#/components/schemas/ParticipantNameInput"
    PartyDeclaration:
      type: object
      additionalProperties: false
      required: [party_ref, display_name]
      properties:
        party_ref:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
          description: Opaque label unique to this request. It is not a Party UUID or a durable identifier.
        display_name: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email, maxLength: 320 }
        phone: { type: string, minLength: 1, maxLength: 64 }
    PartyReference:
      type: object
      additionalProperties: false
      required: [party_ref]
      properties:
        party_ref:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
          description: Must name exactly one purchaser or payer declaration in this request.
    ParticipantNameInput:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name-only intended participant. It remains unresolved until a later approved workflow links a Party.
    CreatePurchaseResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [purchase, access_token]
          properties:
            purchase: { $ref: "#/components/schemas/PublicPurchase" }
            access_token:
              type: string
              minLength: 43
              maxLength: 43
              pattern: "^[A-Za-z0-9_-]{43}$"
              description: Opaque Purchase bearer token. Store securely; it is not returned by read endpoints.
    PublicPurchase:
      type: object
      additionalProperties: false
      required:
        [
          id,
          purchase_ref,
          channel,
          offering,
          participant_count,
          total_amount_minor,
          currency_code,
          status,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        purchase_ref:
          type: string
          pattern: "^QRB-[0-9]{4}-[A-Z2-7]{16}$"
          description: Non-secret support reference. The UUID remains the canonical API identifier.
        channel: { type: string, const: COMMON }
        offering:
          type: object
          additionalProperties: false
          required: [id, name, kind, unit_price_minor, participant_capacity]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            kind: { type: string }
            unit_price_minor:
              type: integer
              minimum: 0
              description: Captured per intended participant; total_amount_minor is this exact value multiplied by participant_count.
            participant_capacity: { type: integer, minimum: 1 }
        participant_count: { type: integer, minimum: 1 }
        participants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [sequence_no, display_name]
            properties:
              sequence_no: { type: integer, minimum: 1 }
              display_name: { type: string }
              status:
                { type: string, enum: [PENDING, ACTIVE, REPLACED, CANCELLED] }
        total_amount_minor:
          type: integer
          minimum: 0
          description: Exact captured unit_price_minor multiplied by participant_count; no rounding is applied.
        currency_code: { type: string, pattern: "^[A-Z]{3}$" }
        status:
          { type: string, enum: [PENDING_PAYMENT, PAID, ELIGIBLE, CANCELLED] }
        reservation_expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    CancelPurchaseRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    PaymentEvidenceRequest:
      type: object
      additionalProperties: false
      required: [amount_minor, currency_code, evidence_file]
      properties:
        amount_minor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency_code: { type: string, pattern: "^[A-Z]{3}$" }
        evidence_file:
          type: string
          format: binary
          description: JPEG, PNG, or PDF with matching content signature; maximum 10 MiB and a normalized filename of at most 255 Unicode characters.
    PublicPayment:
      type: object
      additionalProperties: false
      required:
        [id, payment_ref, amount_minor, currency_code, status, submitted_at]
      properties:
        id: { type: string, format: uuid }
        payment_ref: { type: string, pattern: "^PAY-[A-Z2-7]{26}$" }
        amount_minor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency_code: { type: string, pattern: "^[A-Z]{3}$" }
        status: { type: string, enum: [SUBMITTED, VERIFIED, REJECTED] }
        submitted_at: { type: string, format: date-time }
        rejection_reason: { type: string, maxLength: 1000 }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, details]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - validation_failed
                - unauthenticated
                - forbidden
                - not_found
                - state_conflict
                - quota_unavailable
                - idempotency_conflict
                - evidence_too_large
                - unsupported_media_type
                - rate_limited
                - method_not_allowed
                - internal_error
                - service_unavailable
            message: { type: string }
            request_id: { type: string, maxLength: 64 }
            details: { type: object, additionalProperties: true }
