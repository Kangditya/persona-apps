        }
    InternalError:
      description: Unexpected error; no SQL, stack trace, credentials, or personal data is disclosed.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    ServiceUnavailable:
      description: A required dependency is temporarily unavailable.
      headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
  schemas:
    Session:
      type: object
      additionalProperties: false
      required: [operator, permissions, expires_at, csrf_token]
      properties:
        operator:
          type: object
          additionalProperties: false
          required: [id, display_name]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Permission" }
        expires_at: { type: string, format: date-time }
        csrf_token:
          {
            type: string,
            minLength: 43,
            description: Keep only in Operations Web memory.,
          }
    Permission:
      type: string
      enum:
        [
          event.read,
          event.manage,
          offering.read,
          offering.manage,
          purchase.read,
          payment.read,
          payment.verify,
          participant.read,
          dashboard.read,
          audit.read,
          admin.manage,
        ]
    Event:
      type: object
      additionalProperties: false
      required: [id, event_year, name, status, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        event_year: { type: integer, minimum: 1900, maximum: 9999 }
        name: { type: string, minLength: 1, maxLength: 255 }
        status:
          {
            type: string,
            enum: [DRAFT, PUBLISHED, ACTIVE, SUSPENDED, CLOSED, ARCHIVED],
          }
        registration_opens_at: { type: string, format: date-time }
        registration_closes_at: { type: string, format: date-time }
        participant_quota:
          { type: integer, minimum: 0, maximum: 9007199254740991 }
        version: { type: integer, minimum: 1, maximum: 9007199254740991 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EventInput:
      type: object
      additionalProperties: false
      required: [event_year, name]
      properties:
        event_year: { type: integer, minimum: 1900, maximum: 9999 }
        name: { type: string, minLength: 1, maxLength: 255 }
        registration_opens_at:
          anyOf:
            - { type: string, format: date-time }
            - { type: "null" }
        registration_closes_at:
          anyOf:
            - { type: string, format: date-time }
            - { type: "null" }
        participant_quota:
          anyOf:
            - { type: integer, minimum: 0, maximum: 9007199254740991 }
            - { type: "null" }
    EventPatch:
      type: object
      additionalProperties: false
      required: [expected_version]
      anyOf:
        - required: [name]
        - required: [registration_opens_at]
        - required: [registration_closes_at]
        - required: [participant_quota]
      properties:
        expected_version:
          { type: integer, minimum: 1, maximum: 9007199254740991 }
        name: { type: string, minLength: 1, maxLength: 255 }
        registration_opens_at:
          anyOf:
            - { type: string, format: date-time }
            - { type: "null" }
        registration_closes_at:
          anyOf:
            - { type: string, format: date-time }
            - { type: "null" }
        participant_quota:
          anyOf:
            - { type: integer, minimum: 0, maximum: 9007199254740991 }
            - { type: "null" }
    Offering:
      type: object
      additionalProperties: false
      required:
        [
          id,
          event_id,
          code,
          name,
          offering_kind,
          price_minor,
          currency_code,
          participant_capacity,
          available_participant_units,
          status,
          version,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 255 }
        offering_kind: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, maxLength: 10000 }
        price_minor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        currency_code: { type: string, pattern: "^[A-Z]{3}$" }
        participant_capacity: { type: integer, minimum: 1, maximum: 2147483647 }
        participant_quota:
          { type: integer, minimum: 0, maximum: 9007199254740991 }
        available_participant_units:
          anyOf:
            - { type: integer, minimum: 0, maximum: 9007199254740991 }
            - { type: "null" }
        status:
          { type: string, enum: [DRAFT, PUBLISHED, UNAVAILABLE, ARCHIVED] }
        published_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1, maximum: 9007199254740991 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OfferingInput:
      type: object
      additionalProperties: false
      required:
        [
          code,
          name,
          offering_kind,
          price_minor,
          currency_code,
          participant_capacity,
        ]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 255 }
        offering_kind: { type: string, minLength: 1, maxLength: 64 }
        description:
          anyOf:
            - { type: string, maxLength: 10000 }
            - { type: "null" }
        price_minor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        currency_code: { type: string, pattern: "^[A-Z]{3}$" }
        participant_capacity: { type: integer, minimum: 1, maximum: 2147483647 }
        participant_quota:
          anyOf:
            - { type: integer, minimum: 0, maximum: 9007199254740991 }
            - { type: "null" }
    OfferingPatch:
      type: object
      additionalProperties: false
      required: [expected_version]
      anyOf:
        - required: [name]
        - required: [description]
        - required: [price_minor]
        - required: [participant_quota]
      properties:
        expected_version:
          { type: integer, minimum: 1, maximum: 9007199254740991 }
        name: { type: string, minLength: 1, maxLength: 255 }
        description:
          anyOf:
            - { type: string, maxLength: 10000 }
            - { type: "null" }
        price_minor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        participant_quota:
          anyOf:
            - { type: integer, minimum: 0, maximum: 9007199254740991 }
            - { type: "null" }
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          { type: integer, minimum: 1, maximum: 9007199254740991 }
    PartySummary:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    Purchase:
      type: object
      additionalProperties: false
      required:
        [
          id,
          event_id,
          purchase_ref,
          channel,
          purchaser,
          offering_id,
          participant_count,
          total_amount_minor,
          currency_code,
          status,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        purchase_ref: { type: string }
        channel: { type: string, enum: [COMMON, SAVING, GIVEAWAY] }
        purchaser: { $ref: "#/components/schemas/PartySummary" }
        payer: { $ref: "#/components/schemas/PartySummary" }
        offering_id: { type: string, format: uuid }
        offering_name_snapshot: { type: string }
        participant_count: { type: integer, minimum: 1 }
        participants:
          type: array
          description: Present on detail responses; each value is a stored intended-participant name snapshot.
          items: { $ref: "#/components/schemas/PurchaseParticipantSnapshot" }
        total_amount_minor:
          type: integer
          minimum: 0
          description: Exact captured offering unit price multiplied by participant_count; no rounding is applied.
        currency_code: { type: string, pattern: "^[A-Z]{3}$" }
        status:
          {
            type: string,
            enum:
              [
                DRAFT,
                PENDING_PAYMENT,
                PAID,
                ELIGIBLE,
                ALLOCATED,
                COMPLETED,
                CANCELLED,
              ],
          }
        eligible_at: { type: string, format: date-time }
        cancelled_at: { type: string, format: date-time }
        cancellation_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PurchaseParticipantSnapshot:
      type: object
      additionalProperties: false
      required: [sequence_no, display_name]
      properties:
        sequence_no: { type: integer, minimum: 1 }
        display_name: { type: string, minLength: 1, maxLength: 255 }
    Payment:
      type: object
      additionalProperties: false
      required:
        [
          id,
          event_id,
          payment_ref,
          payer,
          amount_minor,
          currency_code,
          method,
          status,
          submitted_at,
        ]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        payment_ref: { type: string }
        purchase_id: { type: string, format: uuid }
        payer: { $ref: "#/components/schemas/PartySummary" }
        amount_minor: { type: integer, minimum: 1 }
        currency_code: { type: string, pattern: "^[A-Z]{3}$" }
        method: { type: string }
        status:
          { type: string, enum: [SUBMITTED, VERIFIED, REJECTED, REFUNDED] }
        evidence:
          type: object
          additionalProperties: false
          properties:
            filename: { type: string }
            media_type:
              { type: string, enum: [image/jpeg, image/png, application/pdf] }
            size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
        submitted_at: { type: string, format: date-time }
        verified_at: { type: string, format: date-time }
        rejection_reason: { type: string }
    PaymentAction:
      type: object
      additionalProperties: false
      required: [payment, purchase, quota_reservation, participant_activation]
      properties:
        payment: { $ref: "#/components/schemas/Payment" }
        purchase: { $ref: "#/components/schemas/Purchase" }
        quota_reservation:
          type: object
          additionalProperties: false
          required: [status, participant_units]
          properties:
            status:
              { type: string, enum: [RESERVED, CONSUMED, RELEASED, EXPIRED] }
            participant_units: { type: integer, minimum: 1 }
        participant_activation:
          type: object
          additionalProperties: false
          required: [activated_count]
          properties:
            activated_count: { type: integer, minimum: 0 }
            status: { type: string, enum: [PENDING, ACTIVE] }
    Participant:
      type: object
      additionalProperties: false
      required:
        [
          id,
          event_id,
          purchase_id,
          sequence_no,
          display_name,
          status,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        purchase_id: { type: string, format: uuid }
        sequence_no: { type: integer, minimum: 1 }
        display_name: { type: string }
        participant_ref: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE, REPLACED, CANCELLED] }
        created_at: { type: string, format: date-time }
    DashboardSummary:
      type: object
      additionalProperties: false
      required:
        [
          generated_at,
          purchase_counts,
          payment_counts,
          active_participant_count,
        ]
      properties:
        event_id: { type: string, format: uuid }
        generated_at: { type: string, format: date-time }
        purchase_counts:
          type: object
          additionalProperties: false
          properties:
            pending_payment: { type: integer, minimum: 0 }
            paid: { type: integer, minimum: 0 }
            eligible: { type: integer, minimum: 0 }
            cancelled: { type: integer, minimum: 0 }
        payment_counts:
          type: object
          additionalProperties: false
          properties:
            submitted: { type: integer, minimum: 0 }
            verified: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0 }
        active_participant_count: { type: integer, minimum: 0 }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, actor_reference, action, target_type, source, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_reference: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string, format: uuid }
        request_id: { type: string, maxLength: 64 }
        permission: { $ref: "#/components/schemas/Permission" }
        reason: { type: string }
        source: { type: string }
        created_at: { type: string, format: date-time }
    PageInfo:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        next_cursor: { type: string, maxLength: 512 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, details]
          properties:
            code:
              type: string
              enum:
                [
                  invalid_request,
                  validation_failed,
                  unauthenticated,
                  forbidden,
                  not_found,
                  method_not_allowed,
                  stale_version,
                  state_conflict,
                  quota_unavailable,
                  idempotency_conflict,
                  evidence_too_large,
                  request_too_large,
                  unsupported_media_type,
                  rate_limited,
                  internal_error,
                  service_unavailable,
                ]
            message: { type: string }
            request_id: { type: string, maxLength: 64 }
            details: { type: object, additionalProperties: true }
