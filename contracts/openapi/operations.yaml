openapi: 3.1.0
info:
  title: Qurban Operations API
  version: 1.0.0-draft
  description: |
    Phase 1 private Operations contract. It specifies OIDC-backed sessions,
    permission-gated commands, and minimized administrative views. Event and
    Offering routes are implemented; later Operations groups remain draft.
servers:
  - url: https://api.example.invalid
    description: Deployment-specific base URL
security: []
tags:
  - name: Authentication
    description: OIDC-backed Operations sessions and CSRF rotation.
  - name: Events
    description: Event administration and lifecycle transitions.
  - name: Offerings
    description: Offering administration and lifecycle transitions.
  - name: Purchases
    description: Authorized Operations purchase views.
  - name: Payments
    description: Authorized payment views and review commands.
  - name: Participants
    description: Authorized intended and activated participant views.
  - name: Dashboard
    description: Non-authoritative Operations projections.
  - name: Audit
    description: Minimized privileged audit records.
paths:
  /api/operations/v1/auth/login:
    get:
      tags: [Authentication]
      operationId: beginOperationsLogin
      summary: Start OIDC Authorization Code with PKCE login
      description: Creates a short-lived authenticated-encrypted login cookie and redirects to the configured provider.
      x-required-permission: none
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/ReturnTo"
      responses:
        "302":
          description: Redirect to the configured OpenID Connect provider.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Location: { schema: { type: string, format: uri } }
            Set-Cookie: { schema: { type: string } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/operations/v1/auth/callback:
    get:
      tags: [Authentication]
      operationId: completeOperationsLogin
      summary: Complete OIDC login callback
      description: Validates provider response, state, nonce, PKCE, issuer, audience, and active operator mapping before creating a server session.
      x-required-permission: none
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - name: code
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: state
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: error
          in: query
          required: false
          schema: { type: string, maxLength: 255 }
      responses:
        "302":
          description: Redirect to the validated relative return path after setting the Operations session cookie.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/operations/v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getOperationsSession
      summary: Inspect the authenticated session and rotate CSRF protection
      security: [{ OperationsSession: [] }]
      x-required-permission: none
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200": { $ref: "#/components/responses/SessionResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/operations/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutOperationsSession
      summary: Revoke the authenticated session
      description: Repeated logout is harmless. This endpoint does not use command idempotency.
      security: [{ OperationsSession: [] }]
      x-required-permission: none
      x-csrf: required
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session revoked and cookie expired.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Set-Cookie: { schema: { type: string } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/operations/v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events
      description: Cursor pagination defaults to event_year descending, then id ascending.
      security: [{ OperationsSession: [] }]
      x-required-permission: event.read
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/EventListResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create a draft event
      security: [{ OperationsSession: [] }]
      x-required-permission: event.manage
      x-csrf: required
      x-idempotency:
        {
          namespace: operations.event.create,
          retention: 24h,
          replay: exact authorized request,
          mismatch: idempotency_conflict,
        }
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/EventInput" } },
          }
      responses:
        "201": { $ref: "#/components/responses/EventResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { $ref: "#/components/responses/CommandConflict" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/operations/v1/events/{event_id}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get an event
      security: [{ OperationsSession: [] }]
      x-required-permission: event.read
      parameters:
        - $ref: "#/components/parameters/EventID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200": { $ref: "#/components/responses/EventResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update a non-lifecycle event field
      description: Lifecycle status changes use the explicit transition commands.
      security: [{ OperationsSession: [] }]
      x-required-permission: event.manage
      x-csrf: required
      parameters:
        - $ref: "#/components/parameters/EventID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/EventPatch" } },
          }
      responses:
        "200": { $ref: "#/components/responses/EventResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { $ref: "#/components/responses/CommandConflict" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/operations/v1/events/{event_id}/publish:
    $ref: "#/components/pathItems/EventPublish"
  /api/operations/v1/events/{event_id}/activate:
    $ref: "#/components/pathItems/EventActivate"
  /api/operations/v1/events/{event_id}/suspend:
    $ref: "#/components/pathItems/EventSuspend"
  /api/operations/v1/events/{event_id}/close:
    $ref: "#/components/pathItems/EventClose"
  /api/operations/v1/events/{event_id}/archive:
    $ref: "#/components/pathItems/EventArchive"
  /api/operations/v1/events/{event_id}/offerings:
    get:
      tags: [Offerings]
      operationId: listEventOfferings
      summary: List offerings for an event
      description: Cursor pagination defaults to code ascending, then id ascending.
      security: [{ OperationsSession: [] }]
      x-required-permission: offering.read
      parameters:
        - $ref: "#/components/parameters/EventID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OfferingListResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [Offerings]
      operationId: createOffering
      summary: Create a draft offering for an event
      security: [{ OperationsSession: [] }]
      x-required-permission: offering.manage
      x-csrf: required
      x-idempotency:
        {
          namespace: operations.offering.create,
          retention: 24h,
          replay: exact authorized request,
          mismatch: idempotency_conflict,
        }
      parameters:
        - $ref: "#/components/parameters/EventID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/OfferingInput" } },
          }
      responses:
        "201": { $ref: "#/components/responses/OfferingResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { $ref: "#/components/responses/CommandConflict" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/operations/v1/offerings/{offering_id}:
    get:
      tags: [Offerings]
      operationId: getOffering
      summary: Get an offering
      security: [{ OperationsSession: [] }]
      x-required-permission: offering.read
      parameters:
        - $ref: "#/components/parameters/OfferingID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200": { $ref: "#/components/responses/OfferingResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [Offerings]
      operationId: updateOffering
      summary: Update a non-lifecycle offering field
      security: [{ OperationsSession: [] }]
      x-required-permission: offering.manage
      x-csrf: required
      parameters:
        - $ref: "#/components/parameters/OfferingID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/OfferingPatch" } },
          }
      responses:
        "200": { $ref: "#/components/responses/OfferingResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { $ref: "#/components/responses/CommandConflict" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/operations/v1/offerings/{offering_id}/publish:
    $ref: "#/components/pathItems/OfferingPublish"
  /api/operations/v1/offerings/{offering_id}/unavailable:
    $ref: "#/components/pathItems/OfferingUnavailable"
  /api/operations/v1/offerings/{offering_id}/archive:
    $ref: "#/components/pathItems/OfferingArchive"
  /api/operations/v1/purchases:
    get:
      tags: [Purchases]
      operationId: listPurchases
      summary: List purchases
      description: Cursor pagination defaults to created_at descending, then id ascending.
      security: [{ OperationsSession: [] }]
      x-required-permission: purchase.read
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: event_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema:
            { type: string, enum: [PENDING_PAYMENT, PAID, ELIGIBLE, CANCELLED] }
      responses:
        "200": { $ref: "#/components/responses/PurchaseListResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/operations/v1/purchases/{purchase_id}:
    get:
      tags: [Purchases]
      operationId: getPurchase
      summary: Get an Operations purchase view
      security: [{ OperationsSession: [] }]
      x-required-permission: purchase.read
      parameters:
        - $ref: "#/components/parameters/PurchaseID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200": { $ref: "#/components/responses/PurchaseResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/operations/v1/payments:
    get:
      tags: [Payments]
      operationId: listPayments
      summary: List payments
      description: Cursor pagination defaults to submitted_at descending, then id ascending.
      security: [{ OperationsSession: [] }]
      x-required-permission: payment.read
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            { type: string, enum: [SUBMITTED, VERIFIED, REJECTED, REFUNDED] }
      responses:
        "200": { $ref: "#/components/responses/PaymentListResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/operations/v1/payments/{payment_id}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Get an Operations payment view
      security: [{ OperationsSession: [] }]
      x-required-permission: payment.read
      parameters:
        - $ref: "#/components/parameters/PaymentID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200": { $ref: "#/components/responses/PaymentResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/operations/v1/payments/{payment_id}/verify:
    post:
      tags: [Payments]
      operationId: verifyPayment
      summary: Verify submitted payment evidence
      description: Locks and revalidates Payment, Purchase, amount, currency, and quota before atomic activation.
      security: [{ OperationsSession: [] }]
      x-required-permission: payment.verify
      x-csrf: required
      x-idempotency:
        namespace: operations.payment.verify
        replay: exact request hash returns the original successful response after authorization
        mismatch: idempotency_conflict
      parameters:
        - $ref: "#/components/parameters/PaymentID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/PaymentActionResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CommandConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/operations/v1/payments/{payment_id}/reject:
    post:
      tags: [Payments]
      operationId: rejectPayment
      summary: Reject submitted payment evidence
      description: Rejection requires an auditable non-empty reason and releases the applicable quota reservation.
      security: [{ OperationsSession: [] }]
      x-required-permission: payment.verify
      x-csrf: required
      x-idempotency:
        namespace: operations.payment.reject
        replay: exact request hash returns the original successful response after authorization
        mismatch: idempotency_conflict
      parameters:
        - $ref: "#/components/parameters/PaymentID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ReasonRequest" } },
          }
      responses:
        "200": { $ref: "#/components/responses/PaymentActionResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CommandConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/operations/v1/participants:
    get:
      tags: [Participants]
      operationId: listParticipants
      summary: List intended and activated participants
      description: Cursor pagination defaults to created_at descending, then id ascending.
      security: [{ OperationsSession: [] }]
      x-required-permission: participant.read
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: event_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/ParticipantListResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/operations/v1/participants/{participant_id}:
    get:
      tags: [Participants]
      operationId: getParticipant
      summary: Get a participant
      security: [{ OperationsSession: [] }]
      x-required-permission: participant.read
      parameters:
        - $ref: "#/components/parameters/ParticipantID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200": { $ref: "#/components/responses/ParticipantResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/operations/v1/dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      summary: Get the non-authoritative dashboard projection
      security: [{ OperationsSession: [] }]
      x-required-permission: dashboard.read
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - name: event_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/DashboardResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/operations/v1/audit:
    get:
      tags: [Audit]
      operationId: listAuditEntries
      summary: List minimized privileged audit records
      description: Cursor pagination defaults to created_at descending, then id ascending.
      security: [{ OperationsSession: [] }]
      x-required-permission: audit.read
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: target_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/AuditListResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    OperationsSession:
      type: apiKey
      in: cookie
      name: __Host-operations_session
