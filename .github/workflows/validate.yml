name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: persona_apps
          POSTGRES_USER: persona_apps
          POSTGRES_PASSWORD: persona_apps
        options: >-
          --health-cmd "pg_isready -U persona_apps -d persona_apps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Verify Go formatting
        working-directory: apps/api
        run: go run ./cmd/format -check
      - name: Vet Go API
        working-directory: apps/api
        run: go vet ./...
      - name: Test Go API
        working-directory: apps/api
        run: go test ./...
      - name: Build Go API
        working-directory: apps/api
        run: go build ./...

      - name: Verify PostgreSQL migration and seed lifecycle
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: postgres://persona_apps:persona_apps@localhost:5432/persona_apps?sslmode=disable
          TEST_DATABASE_URL: postgres://persona_apps:persona_apps@localhost:5432/persona_apps?sslmode=disable
        run: |
          go run ./cmd/db migrate validate
          go run ./cmd/db migrate up
          go run ./cmd/db migrate version
          go run ./cmd/db migrate status
          go run ./cmd/db seed run --group reference
          go run ./cmd/db seed run --group reference
          go test ./...
          go run ./cmd/db migrate down --steps 1
          go run ./cmd/db migrate up --steps 1
          go run ./cmd/db migrate version

      - run: docker compose -f infrastructure/compose.yaml config
      - run: docker build -f apps/api/Dockerfile .
