services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-persona_apps}
      POSTGRES_USER: ${POSTGRES_USER:-persona_apps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-persona_apps}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-persona_apps} -d ${POSTGRES_DB:-persona_apps}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
