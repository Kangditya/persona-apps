services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brand_commerce}
      POSTGRES_USER: ${POSTGRES_USER:-brand_commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brand_commerce}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-brand_commerce} -d ${POSTGRES_DB:-brand_commerce}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
